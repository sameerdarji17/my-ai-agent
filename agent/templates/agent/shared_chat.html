<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared chat — {{ agent_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0D0E12; --panel:#16171D; --border:#24262E; --text:#EDEAE2; --dim:#8B8D97; --accent:#7C83FD;
    --user-bubble:#1E2030; --assistant-bubble:#16171D; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:40px 20px; }
  .badge { display:flex; align-items:center; gap:8px; margin-bottom:24px; color:var(--dim); font-size:13px; }
  .logo-badge { width:22px; height:22px; border-radius:6px; background:var(--accent); display:flex;
    align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:10px; color:#fff; }
  .thread { width:100%; max-width:680px; display:flex; flex-direction:column; gap:16px; }
  .row { display:flex; flex-direction:column; max-width:88%; }
  .row.user { align-self:flex-end; align-items:flex-end; }
  .row.assistant { align-self:flex-start; align-items:flex-start; }
  .bubble { padding:12px 16px; border-radius:14px; line-height:1.55; font-size:14.5px; white-space:pre-wrap; }
  .row.user .bubble { background:var(--user-bubble); border:1px solid #4A4FBF; border-bottom-right-radius:4px; }
  .row.assistant .bubble { background:var(--assistant-bubble); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .footer-note { margin-top:32px; color:var(--dim); font-size:12.5px; text-align:center; }
  .footer-note a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <div class="badge"><div class="logo-badge">SD</div> Shared conversation — read only</div>
  <div class="thread">
    {% for m in messages %}
      <div class="row {{ m.role }}"><div class="bubble">{{ m.text }}</div></div>
    {% endfor %}
  </div>
  <div class="footer-note">
    Made with {{ agent_name }} — <a href="/">start your own chat</a>
  </div>
</body>
</html>
