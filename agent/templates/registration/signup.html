{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — SD AGENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: #F8FAF9;
            color: #18181B;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 40px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }
        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #18181B;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            flex: 1;
        }

        .title-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: #18181B;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .subtitle-text {
            font-size: 16px;
            color: #71717A;
            font-weight: 500;
            margin-bottom: 32px;
        }

        .auth-card {
            background: #FFFFFF;
            border: 1px solid #E4E4E7;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            max-width: 440px;
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: #FFFFFF;
            border: 1px solid #E4E4E7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #18181B;
            transition: background 0.2s;
        }
        .btn-google:hover { background: #F4F4F5; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #A1A1AA;
            font-size: 12px;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E4E4E7;
        }
        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: #F4F4F5;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .input-field:focus {
            background: #FFFFFF;
            border-color: #6366F1;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #18181B;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .btn-submit:hover { background: #27272A; }

        .image-container {
            width: 100%;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            cursor: pointer;
        }
        .image-container:hover {
            transform: scale(1.03) rotate(0.8deg) translateY(-6px);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.15);
        }
        .side-image {
            width: 100%;
            height: 100%;
            max-height: 520px;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        .image-container:hover .side-image {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; gap: 30px; }
            .image-container { display: none; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="/" class="brand">
            <!-- Custom Image Logo from Static Folder -->
            <img src="{% static 'images/logo_draft3.png' %}" alt="SD AGENT" style="width: 36px; height: 36px; border-radius: 10px; object-fit: contain;">
            <span>SD AGENT</span>
        </a>
    </header>

    <div class="container">
        <div>
            <h1 class="title-text">Question what's next</h1>
            <p class="subtitle-text">Your thinking partner for big ambitions</p>

            <div class="auth-card">
                <button class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.35 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29C.47 8.21 0 10.05 0 12s.47 3.79 1.29 5.42l3.99-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    Continue with Google
                </button>

                <div class="divider">OR</div>

                <form method="post" action="{% url 'signup' %}">
                    {% csrf_token %}
                    <input type="email" name="email" class="input-field" placeholder="Enter your email" required>
                    <input type="password" name="password" class="input-field" placeholder="Enter password" required>
                    <button type="submit" class="btn-submit">Continue with email</button>
                </form>
            </div>
        </div>

        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" alt="SD AGENT Workspace" class="side-image">
        </div>
    </div>

</body>
</html>
