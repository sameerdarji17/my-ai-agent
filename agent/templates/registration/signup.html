{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SD AGENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #FAF8F5; color: #1F1E1C; min-height: 100vh; display: flex; flex-direction: column; }

        .header { padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'Instrument Serif', serif; font-size: 26px; font-weight: 600; text-decoration: none; color: #1F1E1C; display: flex; align-items: center; gap: 10px; }
        .logo-mark { width: 32px; height: 32px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .logo-mark svg { width: 100%; height: 100%; display: block; }

        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; gap: 60px; max-width: 1200px; margin: 0 auto; width: 100%; }

        .auth-card { background: transparent; width: 100%; max-width: 420px; }
        .title { font-family: 'Instrument Serif', serif; font-size: 48px; font-weight: 400; line-height: 1.1; margin-bottom: 12px; }
        .subtitle { font-size: 16px; color: #6B6966; margin-bottom: 32px; }

        .form-box { background: #FFFFFF; border: 1px solid #E6E4E0; border-radius: 20px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }

        .google-btn-wrapper { width: 100%; display: flex; justify-content: center; margin-bottom: 12px; }

        .divider { display: flex; align-items: center; margin: 20px 0; color: #A3A199; font-size: 12px; font-weight: 500; }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #E6E4E0; }
        .divider span { padding: 0 12px; }

        .form-group { margin-bottom: 16px; }
        .form-control { width: 100%; padding: 14px 16px; border: 1px solid #E6E4E0; border-radius: 12px; font-size: 15px; outline: none; background: #FAF8F5; transition: 0.2s; color: #1F1E1C; }
        .form-control:focus { border-color: #1F1E1C; background: #FFFFFF; }

        .btn-primary { width: 100%; padding: 14px; background: #1F1E1C; color: #FFFFFF; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-primary:hover { background: #383734; }

        .side-image { flex: 1; max-width: 520px; border-radius: 24px; overflow: hidden; display: none; }
        .side-image img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 24px; }

        .error-msg { background: #FDF2F2; border: 1px solid #F8B4B4; color: #9B1C1C; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }

        @media (min-width: 900px) {
            .side-image { display: block; height: 560px; }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="{% url 'chat-page' %}" class="logo">
        <div class="logo-mark">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#101118"/><path d="M44 32C34 32 29 36 29 42C29 47 35 49 39 50C44 51 50 52 50 58C50 64 44 68 33 68" fill="none" stroke="#9BA1FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 31L47 69M47 31C64 31 73 40 73 50C73 60 64 69 47 69" fill="none" stroke="#7C83FD" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        SD AGENT
    </a>
</header>

<main class="container">
    <div class="auth-card">
        <h1 class="title">Question what's next</h1>
        <p class="subtitle">Your thinking partner for big ambitions</p>

        <div class="form-box">
            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <div class="google-btn-wrapper">
                <div id="g_id_onload"
                     data-client_id="863111260550-sk4hboauil823bt33uk7pinp2ouqtue4.apps.googleusercontent.com"
                     data-login_uri="https://sd-agent.up.railway.app/api/google-auth/"
                     data-ux_mode="redirect"
                     data-auto_prompt="false">
                </div>

                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="continue_with"
                     data-size="large"
                     data-logo_alignment="left"
                     data-width="364">
                </div>
            </div>

            <div class="divider"><span>OR</span></div>

            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-primary">Continue with email</button>
            </form>
        </div>
    </div>

    <div class="side-image">
        <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1000&q=80" alt="Workspace">
    </div>
</main>

</body>
</html>
